<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firas Photography | Professional Visual Storytelling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;600;700&family=Montserrat:wght=300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #F5C542; --dark: #0F0F0F; --zinc-dark: #121212; --light-gray: #EAEAEA; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--dark); color: white; overflow-x: hidden; }
        .gold-text { color: var(--gold); }
        .gold-bg { background-color: var(--gold); }
        .nav-glass { background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(245, 197, 66, 0.1); }
        .card-hover { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-hover:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(245, 197, 66, 0.1); }
        .hidden-section { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .visible-section { opacity: 1; transform: translateY(0); }
        .star-rating { cursor: pointer; font-size: 1.5rem; transition: color 0.2s; color: #3f3f46; }
        .star-rating.active, .star-rating:hover { color: var(--gold); }
        .modal-overlay { background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); z-index: 200; display: none; }
        .modal-overlay.active { display: flex; }
        .cart-sidebar { transform: translateX(100%); transition: transform 0.4s ease-in-out; }
        .cart-sidebar.active { transform: translateX(0); }
    </style>
</head>
<body>

        <div class="container mx-auto px-4 h-20 flex justify-between items-center">
            <div class="text-xl md:text-2xl font-bold tracking-tighter">
                FIRAS<span class="gold-text">PHOTO</span>
            </div>
            <nav class="hidden xl:flex space-x-6 text-[10px] uppercase tracking-[0.2em] font-bold">
                <a href="#home" class="hover:text-[#F5C542] transition" data-key="nav_home"></a>
                <a href="#about" class="hover:text-[#F5C542] transition" data-key="nav_about"></a>
                <a href="#philosophy" class="hover:text-[#F5C542] transition" data-key="nav_philosophy"></a>
                <a href="#services" class="hover:text-[#F5C542] transition" data-key="nav_services"></a>
                <a href="#gallery" class="hover:text-[#F5C542] transition" data-key="nav_gallery"></a>
                <a href="#booking" class="hover:text-[#F5C542] transition" data-key="nav_booking"></a>
                <a href="#team" class="hover:text-[#F5C542] transition" data-key="nav_team"></a>

                <button onclick="toggleCart()" class="p-2 hover:text-[#F5C542] relative text-lg">

                </button>
                <button onclick="toggleLogin()" class="p-2 hover:text-[#F5C542] text-lg"><i class="fa-solid fa-user"></i></button>

        </div>

    <div id="search-modal" class="modal-overlay fixed inset-0 flex-col items-center justify-center p-6">

        <div class="w-full max-w-2xl">

            <div id="search-results" class="mt-8 grid grid-cols-1 gap-4 max-h-[50vh] overflow-y-auto"></div>
        </div>
    </div>

    <div id="login-modal" class="modal-overlay fixed inset-0 items-center justify-center p-6">

            <h3 class="text-2xl font-bold mb-8 gold-text uppercase tracking-widest text-center" data-key="login_title"></h3>

                <p class="text-center text-xs text-zinc-500 mt-4 cursor-pointer hover:text-white" data-key="no_account"></p>
            </form>
        </div>
    </div>

    <div id="cart-sidebar-overlay" class="modal-overlay fixed inset-0" onclick="toggleCart()"></div>
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full max-w-md bg-zinc-900 z-[250] cart-sidebar border-l border-zinc-800 flex flex-col">

            <h3 class="text-xl font-bold gold-text uppercase tracking-widest" data-key="cart_title"></h3>
            <button onclick="toggleCart()" class="text-2xl hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>

        <div class="p-6 border-t border-zinc-800 bg-zinc-900/50">
            <div class="flex justify-between items-center mb-6">
                <span class="uppercase text-xs font-bold tracking-widest text-zinc-400" data-key="cart_total_label"></span>
                <span id="cart-total" class="text-2xl font-bold gold-text">0 ₽</span>
            </div>
            <button onclick="checkout()" class="w-full gold-bg text-black py-4 rounded-xl font-black uppercase tracking-widest hover:bg-white transition" data-key="cart_checkout"></button>
        </div>

    <section id="home" class="relative min-h-screen flex items-center justify-center pt-20 overflow-hidden">

        <div class="container mx-auto px-6">
            <div class="max-w-4xl mx-auto bg-zinc-900 p-12 rounded-3xl border border-zinc-800 shadow-2xl">
                <h2 class="text-3xl font-bold mb-12 gold-text uppercase text-center tracking-widest" data-key="nav_booking"></h2>
                <form id="booking-form" onsubmit="handleBooking(event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="text" data-key="book_name" placeholder="" required class="bg-zinc-800 border border-zinc-700 p-4 rounded-xl outline-none focus:border-[#F5C542] text-white">
                    <input type="email" data-key="book_email" placeholder="" required class="bg-zinc-800 border border-zinc-700 p-4 rounded-xl outline-none focus:border-[#F5C542] text-white">

        const services = [
            { id: 1, name: "Personal Portrait", ruName: "Личный Портрет", price: 5000, img: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&q=80&w=400", descen: "1 hour, 5 retouched photos, color grading.", descru: "1 час, 5 отретушированных фото, цветокоррекция." },
            { id: 2, name: "Graduation Session", ruName: "Сессия Выпускного", price: 9000, img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=400", descen: "2 hours, 10 retouched photos, group shots.", descru: "2 часа, 10 отретушированных фото, групповые снимки." },
            { id: 3, name: "Event Photography", ruName: "Репортажная Съемка", price: 12000, img: "https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&q=80&w=400", descen: "Full coverage, candid shots, artistic edits.", descru: "Полное освещение, живые снимки, художественное редактирование." },
            { id: 4, name: "Wedding Cinema", ruName: "Свадебное Кино", price: 25000, img: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&q=80&w=400", descen: "Full coverage, cinematic processing, high-end.", descru: "Полное освещение, кинематографическая обработка, премиум класс." },
            { id: 5, name: "Tourism Photoshoot", ruName: "Туристическая Съемка", price: 10000, img: "https://images.unsplash.com/photo-1527631746610-bca00a040d60?auto=format&fit=crop&q=80&w=400", descen: "Outdoor shoot at iconic locations, 8 edits.", descru: "Съемка на открытом воздухе в знаковых местах, 8 обработанных фото." }
        ];

        const team = [
            { name: "Firas", roleen: "Lead Photographer", roleru: "Ведущий Фотограф", img: "firas1.JPG.jpg" },
            { name: "Sally", roleen: "Designer", roleru: "Дизайнер", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=400" }
        ];

        let reviews = [
            { name: "Sami", text: "Incredible attention to detail!", rating: 5 },
            { name: "Dana", text: "Amazing portraits, absolutely love them.", rating: 5 }
        ];

        let currentLang = 'en';
        let cart = [];
        let currentStars = 0;

        function switchLanguage() {
            currentLang = currentLang === 'en' ? 'ru' : 'en';
            document.getElementById('lang-btn').innerText = currentLang === 'en' ? 'RU' : 'EN';
            
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if(translations[currentLang][key]) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = translations[currentLang][key];
                    } else {
                        el.innerText = translations[currentLang][key];
                    }
                }
            });
            renderServices();
            renderTeam();
            renderFooterServices();
            updateCartUI();
        }

        function renderServices() {
            const grid = document.getElementById('services-grid');
            const select = document.getElementById('service-select');
            
            grid.innerHTML = services.map(s => `
                <div class="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden card-hover">
                    <img src="${s.img}" class="w-full h-64 object-cover grayscale hover:grayscale-0 transition duration-500">
                    <div class="p-8">
                        <h3 class="text-xl font-bold mb-2 uppercase">${currentLang === 'en' ? s.name : s.ruName}</h3>
                        <p class="text-zinc-500 text-sm mb-6">${currentLang === 'en' ? s.descen : s.descru}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-2xl font-bold gold-text">${s.price} ₽</span>
                            <button onclick="addToCart(${s.id})" class="p-4 gold-bg text-black rounded-xl hover:scale-110 transition"><i class="fa-solid fa-cart-plus"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');

            const selectTitle = currentLang === 'en' ? "Select Service" : "Выберите услугу";
            select.innerHTML = `<option value="">${selectTitle}</option>` + services.map(s => `<option value="${s.id}">${currentLang === 'en' ? s.name : s.ruName}</option>`).join('');
        }

        function renderTeam() {
            document.getElementById('team-grid').innerHTML = team.map(t => `
                <div class="card-hover">
                    <img src="${t.img}" class="w-48 h-48 rounded-full mx-auto mb-6 object-cover border-4 border-[#F5C542]">
                    <h3 class="text-2xl font-bold uppercase">${t.name}</h3>
                    <p class="gold-text uppercase text-xs tracking-widest font-bold mt-2">${currentLang === 'en' ? t.roleen : t.roleru}</p>
                </div>
            `).join('');
        }

        function renderFooterServices() {
            document.getElementById('footer-services-list').innerHTML = services.slice(0, 4).map(s => `
                <li><a href="#services" class="hover:text-white transition">${currentLang === 'en' ? s.name : s.ruName}</a></li>
            `).join('');
        }

        // إعدادات وتحديثات سلة المشتريات بالكامل
        function addToCart(id) {
            const s = services.find(x => x.id === id);
            cart.push({...s, cartId: Date.now()});
            updateCartUI();
            if(document.getElementById('cart-sidebar').classList.contains('active') === false) {
                toggleCart();
            }
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-items-list');
            const countEl = document.getElementById('cart-count');
            const totalEl = document.getElementById('cart-total');
            
            countEl.innerText = cart.length;
            if(cart.length > 0) countEl.classList.remove('hidden');
            else countEl.classList.add('hidden');

            if(cart.length === 0) {
                list.innerHTML = `<p class="text-zinc-500 text-center py-10 italic">${translations[currentLang].cart_empty}</p>`;
                totalEl.innerText = "0 ₽";
                return;
            }

            list.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between bg-zinc-800/50 p-4 rounded-xl border border-zinc-800">
                    <div class="flex items-center space-x-4">
                        <img src="${item.img}" class="w-12 h-12 object-cover rounded-lg">
                        <div>
                            <h4 class="text-sm font-bold text-white uppercase">${currentLang === 'en' ? item.name : item.ruName}</h4>
                            <p class="text-xs gold-text">${item.price} ₽</p>
                        </div>
                    </div>
                    <button onclick="removeFromCart(${item.cartId})" class="text-zinc-500 hover:text-red-400 p-2"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            totalEl.innerText = `${total} ₽`;
        }

        function checkout() {
            if(cart.length === 0) return;
            alert(currentLang === 'en' ? "Order processed! Firas will contact you soon." : "Заказ принят! Фирас свяжется с вами в ближайшее время.");
            cart = [];
            updateCartUI();
            toggleCart();
        }

        // نافذة البحث الذكي والفلترة الفورية للخدمات المعروضة
        function toggleSearch() { 
            const m = document.getElementById('search-modal');
            m.classList.toggle('active');
            if(m.classList.contains('active')) {
                document.getElementById('search-input').value = '';
                document.getElementById('search-results').innerHTML = '';
                document.getElementById('search-input').focus();
            }
        }

        document.getElementById('search-input').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            const resultsContainer = document.getElementById('search-results');
            if(!query) { resultsContainer.innerHTML = ''; return; }

            const filtered = services.filter(s => 
                s.name.toLowerCase().includes(query) || 
                s.ruName.toLowerCase().includes(query)
            );

            if(filtered.length === 0) {
                resultsContainer.innerHTML = `<p class="text-zinc-500 text-center py-4">${currentLang === 'en' ? 'No results found' : 'Ничего не найдено'}</p>`;
                return;
            }

            resultsContainer.innerHTML = filtered.map(s => `
                <a href="#services" onclick="toggleSearch()" class="flex items-center justify-between bg-zinc-900 p-4 rounded-xl border border-zinc-800 hover:border-[#F5C542] transition">
                    <div class="flex items-center space-x-4">
                        <img src="${s.img}" class="w-12 h-12 object-cover rounded-lg">
                        <span class="font-bold text-white uppercase">${currentLang === 'en' ? s.name : s.ruName}</span>
                    </div>
                    <span class="gold-text font-bold">${s.price} ₽</span>
                </a>
            `).join('');
        });

        // النوافذ المنبثقة التفاعلية الأخرى
        function toggleLogin() { document.getElementById('login-modal').classList.toggle('active'); }
        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('active');
            document.getElementById('cart-sidebar-overlay').classList.toggle('active');
        }

        function handleLogin(e) {
            e.preventDefault();
            alert(currentLang === 'en' ? "Welcome back to Firas Photography!" : "Добро пожаловать обратно в Firas Photography!");
            toggleLogin();
        }

        function handleBooking(e) {
            e.preventDefault();
            alert(currentLang === 'en' ? "Reservation requested successfully!" : "Заявка на бронирование успешно отправлена!");
            document.getElementById('booking-form').reset();
        }

        // إدارة مراجعات وآراء وتقييمات العملاء بالنجوم
        document.querySelectorAll('#star-input .star-rating').forEach(star => {
            star.addEventListener('click', function() {
                currentStars = parseInt(this.getAttribute('data-val'));
                document.querySelectorAll('#star-input .star-rating').forEach(s => {
                    if(parseInt(s.getAttribute('data-val')) <= currentStars) s.classList.add('active');
                    else s.classList.remove('active');
                });
            });
        });

        function renderReviews() {
            document.getElementById('reviews-container').innerHTML = reviews.map(r => `
                <div class="bg-zinc-900 p-8 rounded-3xl border border-zinc-800 card-hover">
                    <div class="flex text-[#F5C542] mb-4">
                        ${Array(r.rating).fill('<i class="fa-solid fa-star text-sm"></i>').join('')}
                        ${Array(5 - r.rating).fill('<i class="fa-regular fa-star text-sm text-zinc-700"></i>').join('')}
                    </div>
                    <p class="text-zinc-400 text-sm italic mb-6">"${r.text}"</p>
                    <h4 class="font-bold uppercase text-xs tracking-widest text-white">— ${r.name}</h4>
                </div>
            `).join('');
        }

        function submitReview() {
            const name = document.getElementById('rev-name').value.trim();
            const text = document.getElementById('rev-text').value.trim();
            if(!name || !text || currentStars === 0) {
                alert(currentLang === 'en' ? "Please complete all fields and select a rating." : "Пожалуйста, заполните все поля и выберите оценку.");
                return;
            }
            reviews.unshift({ name, text, rating: currentStars });
            renderReviews();
            document.getElementById('rev-name').value = '';
            document.getElementById('rev-text').value = '';
            currentStars = 0;
            document.querySelectorAll('#star-input .star-rating').forEach(s => s.classList.remove('active'));
        }

        // تهيئة تشغيل الموقع عند التحميل الأول للصفحة
        window.onload = function() {
            switchLanguage(); // يضبط اللغات تلقائياً على القيمة الأساسية ويفعلها
            renderReviews();
        };
    </script>
